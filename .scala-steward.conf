pullRequests.grouping = [
  { name = "patches", "title" = "Patch updates", "filter" = [{"version" = "patch"}] },
  { name = "minor_major", "title" = "Minor/major updates", "filter" = [{"version" = "minor"}, {"version" = "major"}] },
  { name = "all", title = "Dependency updates", "filter" = [{"group" = "*"}] }
]

# Library stays on Scala 2.13 and 3.3 LTS. Newer Scala 3 lines would force
# that version on all users. sbt 2 is a migration, not a routine bump.
updates.pin = [
  { groupId = "org.scala-lang", artifactId = "scala-library", version = { prefix = "2.13." } },
  { groupId = "org.scala-lang", artifactId = "scala3-library", version = { prefix = "3.3." } },
  { groupId = "org.scala-sbt", artifactId = "sbt", version = { prefix = "1." } }
]
